<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>PixelForge Contacto</title>
    <!--CDN BOOTSTRAP 5.3-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body class="bg-black text-white">
    <header class="text-center py-4">
        <h1 class="display-4 fw-bold text-info">PixelForge</h1>
    </header>
    <!--Barra de navegación-->
    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-info" href="index.html">PixelForge</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item ">
                        <a class="nav-link" href="about.html">Quiénes somos</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="contact.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--Rejilla 3 columnas-->
    <div class="container-fluid">
        <div class="row">

            <aside class="col-12 col-md-2 border border-secondary">
                <!-- Espacio para publicidad  -->
            </aside>

            <main class="col-12 col-md-8 p-4">
                <h2 class="text-info">Contacto</h2>
                <form id="formContacto">
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" placeholder="nombre@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="4"
                            placeholder="Cuéntanos qué equipo quieres armar" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-info">Enviar</button>
                </form>
                <div id="alertaMensaje" class="mt-3"></div>
            </main>

            <aside class="col-12 col-md-2 border border-secondary">
                <!-- Espacio  para noticias  -->
            </aside>

        </div>
    </div>

    <footer class="bg-dark text-center py-3">
        <p class="mb-0">PixelForge © 2026 By Laura RL</p>
    </footer>
    

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
        <script src="script.js"></script>
</body>

</html>
